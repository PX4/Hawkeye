name: Set up Android build
description: >
  Installs the pinned NDK and CMake and restores the Gradle and native build caches.
  Shared by the debug and release CI jobs in android.yml and the android release job,
  so the toolchain versions are pinned in one place.

inputs:
  cxx-cache-prefix:
    description: >
      Cache key prefix for the android/app/.cxx tree. Use a distinct prefix per build
      variant: AGP writes debug into .cxx/Debug and release into .cxx/RelWithDebInfo, and
      actions/cache only saves when the exact key is absent, so a shared key would let
      whichever job finished first claim it and starve the other variant.
    required: false
    default: ndk

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install NDK and CMake
      shell: bash
      run: |
        # A composite action's `shell: bash` runs with -o pipefail, unlike a workflow
        # run step. sdkmanager stops reading once the licenses are accepted, which kills
        # `yes` with SIGPIPE and would fail the pipeline on 141. Only sdkmanager's own
        # exit status is meaningful here, and -e still catches that.
        set +o pipefail
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "ndk;30.0.14904198" \
          "cmake;3.22.1"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    # Everything that can move AGP's native config hash has to be in this key. That is
    # app/build.gradle.kts, which pins ndkVersion and the CMake version, and AndroidCommon.kt,
    # which owns minSdk: the hash contains -DANDROID_PLATFORM and -DCMAKE_SYSTEM_VERSION, both
    # derived from minSdk. Miss one and bumping it restores a stale cache, builds into a new
    # config hash directory, and then never re-saves because the key already exists, leaving
    # native builds permanently cold.
    - name: Cache native build artifacts
      uses: actions/cache@v4
      with:
        path: android/app/.cxx
        key: ${{ inputs.cxx-cache-prefix }}-${{ runner.os }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt', 'android/app/build.gradle.kts', 'android/build-logic/convention/src/main/kotlin/com/px4/hawkeye/buildlogic/AndroidCommon.kt') }}
        restore-keys: ${{ inputs.cxx-cache-prefix }}-${{ runner.os }}-
