name: Release

on:
  push:
    tags:
      # desktop-v* releases the desktop builds and the Homebrew tap; android-v* releases
      # the Android app. Bare v* is listed only so the version job can reject it with a
      # pointer to the two prefixes; it used to release everything at once.
      - 'desktop-v*'
      - 'android-v*'
      - 'v*'

permissions:
  contents: write

jobs:
  # The desktop and Android releases key off these outputs, and never both run for one
  # tag.
  version:
    name: Version and scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.version.outputs.scope }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Derive version and scope from tag
        id: version
        run: .github/scripts/release/get-release-versions.sh

  # Every release starts as a draft and is published only once all of its artifacts are
  # uploaded, so nobody sees a half-built release and a failed run leaves nothing public.
  create-draft:
    name: Create draft release
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SCOPE: ${{ needs.version.outputs.scope }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Create draft release
        run: .github/scripts/release/create-draft.sh "$GITHUB_REF_NAME" "$SCOPE" "$VERSION" "$PRERELEASE"

  desktop:
    name: Desktop
    needs: [version, create-draft]
    if: needs.version.outputs.scope == 'desktop'
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.version.outputs.version }}

  homebrew:
    name: Homebrew bottle
    needs: [version, desktop]
    if: needs.version.outputs.scope == 'desktop'
    uses: ./.github/workflows/homebrew-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tarball_sha256: ${{ needs.desktop.outputs.tarball_sha256 }}

  android:
    name: Android
    needs: [version, create-draft]
    if: needs.version.outputs.scope == 'android'
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # Runs when every upload path that applies to this tag succeeded; the other scope's
  # jobs are skipped, which !failure() lets through.
  publish:
    name: Publish release
    needs: [version, create-draft, desktop, homebrew, android]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SCOPE: ${{ needs.version.outputs.scope }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Publish release
        run: .github/scripts/release/publish.sh "$GITHUB_REF_NAME" "$SCOPE" "$PRERELEASE"

  # Desktop only, and only after publish: the formula points at the release's public
  # download URLs, which do not resolve while it is a draft. !failure() is required, not
  # decoration: without a status function the condition gets an implicit success(),
  # which also counts the skipped android job upstream of publish and skips this job.
  homebrew-tap:
    name: Homebrew tap
    needs: [version, desktop, homebrew, publish]
    if: ${{ !failure() && !cancelled() && needs.version.outputs.scope == 'desktop' && needs.publish.result == 'success' }}
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tarball_sha256: ${{ needs.desktop.outputs.tarball_sha256 }}
      bottle_sha256: ${{ needs.homebrew.outputs.bottle_sha256 }}
      bottle_tag: ${{ needs.homebrew.outputs.bottle_tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
