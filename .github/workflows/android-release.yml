name: Android release

# Called by release.yml for android-v* tags. Uploads the APK to the draft release
# release.yml created, and the AAB to the Google Play internal track.
on:
  workflow_call:
    inputs:
      version:
        description: Release version, the tag with its prefix stripped
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    # The secrets context is unavailable in every if condition, job-level and step-level
    # alike, so presence is computed here as booleans: each expression result is the
    # string "true" or "false", which is all the guards need, and no secret material
    # lands in any step's environment.
    env:
      HAS_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
      HAS_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-android-build
        with:
          cxx-cache-prefix: ndk-release

      # The keystore secret itself is scoped to this one step; later steps branch on the
      # HAWKEYE_UPLOAD_KEYSTORE path this step exports rather than re-reading the secret,
      # so no other step, including third-party actions, ever sees the keystore. A fork
      # without secrets skips this step, builds the unsigned APK, and skips Play, which
      # is exactly the pre-signing behavior.
      - name: Decode upload keystore
        if: env.HAS_UPLOAD_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "HAWKEYE_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # Unlike the keystore, this has to land inside the tree: the google-services plugin
      # reads app/google-services.json and nothing else. It is gitignored, and a fork
      # without the secret skips this step and ships with Crashlytics dormant.
      - name: Decode Firebase config
        if: env.HAS_FIREBASE_CONFIG == 'true'
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d > android/app/google-services.json

      - name: Build release APK and AAB
        working-directory: android
        env:
          VERSION: ${{ inputs.version }}
          HAWKEYE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          HAWKEYE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease -PhawkeyeVersionName="$VERSION"

      - name: Verify and stage APK
        id: apk
        run: .github/scripts/android/stage-apk.sh "${{ inputs.version }}"

      # ${HAWKEYE_UPLOAD_KEYSTORE:+--signed} expands to --signed only when the keystore
      # was decoded, matching how the APK was checked.
      - name: Verify AAB
        run: android/scripts/verify-release-bundle.sh android/app/build/outputs/bundle/release/app-release.aab ${HAWKEYE_UPLOAD_KEYSTORE:+--signed}

      # Without this, a native crash in the renderer arrives as raw hex addresses. The
      # unstripped libhawkeye.so only exists in this job's build tree, so the symbols have
      # to be sent from here, and before the APK is published rather than after, so a
      # failure stops the release instead of shipping an unsymbolicated one. The service
      # account is scoped to this step, the only one that consumes it.
      - name: Upload native symbols to Crashlytics
        # Both secrets, not just the config: this step runs between verifying the AAB and
        # publishing the APK, so failing here on a missing service account would strand a
        # tag half-released. Absent either secret the release simply ships unsymbolicated.
        if: env.HAS_FIREBASE_CONFIG == 'true' && env.HAS_FIREBASE_SERVICE_ACCOUNT == 'true'
        working-directory: android
        env:
          VERSION: ${{ inputs.version }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # This is a second Gradle invocation, and "Decode upload keystore" exported
          # HAWKEYE_UPLOAD_KEYSTORE through GITHUB_ENV, so it is still set here. :app
          # configures a signing config whenever that path is present and requires the
          # matching password and alias, which were scoped to the build step alone, so
          # without these two the symbol upload dies at configuration time and takes the
          # APK publish and the Play upload down with it. They stay step-scoped rather
          # than moving to the job, so no third-party action ever sees them.
          HAWKEYE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          HAWKEYE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: ../.github/scripts/android/upload-crashlytics-symbols.sh "$VERSION"

      - name: Upload APK to release
        run: gh release upload "${{ github.ref_name }}" "${{ steps.apk.outputs.file }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The AAB goes to Google Play only; it is useless to sideloaders, so it is not
      # attached to the GitHub release. Prerelease tags upload too: rc builds are what
      # the internal track is for, and the version code scheme orders them correctly.
      # Promotion beyond internal testing stays manual in the Play Console. The service
      # account secret is scoped to this step, the only one that consumes it.
      - name: Upload AAB to Play internal testing
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.px4.hawkeye.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
